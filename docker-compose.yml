services:
  web:
    build:
      context: .
      args:
        uid: ${UID}
        username: ${USERNAME}
    restart: unless-stopped
    ports:
      - 8080:80
    environment:
      - APACHE_RUN_USER=#${UID}
      - APACHE_RUN_GROUP=#${UID}
    volumes:
      - .:/var/www/html
      - .:/home/${USERNAME}/project
      - ./.docker/apache/default.conf:/etc/apache2/sites-available/000-default.conf:ro
    depends_on:
      - mysql
  mysql:
    image: mysql:9.5.0
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - ./dump:/docker-entrypoint-initdb.d:ro
      - ./conf:/etc/mysql/conf.d:ro
      - persistent:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    ports:
      - 8081:80
    environment:
      - PMA_HOST=mysql
      - PMA_USER=${DB_USERNAME}
      - PMA_PASSWORD=${DB_PASSWORD}
    depends_on:
      - mysql
volumes:
  persistent:
